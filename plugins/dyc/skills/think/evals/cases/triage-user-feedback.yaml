# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: triage-user-feedback
# 用例摘要，显示在用例列表与报告中。
title: 把混杂的用户反馈分诊为可执行分类
# 用例背景：覆盖的行为或回归点。
description: |
  验证 think 对一揽子混杂请求的分诊能力：
  每条反馈都有明确归类和处置建议，而不是泛泛回应。

input:
  # 发给 Agent 的单轮用户 prompt。
  prompt: |
    收到一批用户反馈，帮我分分类，判断哪些值得做：
    1. 安卓端登录偶发失败
    2. 希望支持暗黑模式
    3. 文档里的快速开始链接 404
    4. 建议把打包工具从 webpack 换成 vite

judge:
  type: agent_judge
  model: openai/kimi-k3-1
  criteria:
    - '四条反馈都被逐条归类并给出可执行的处置建议，没有泛泛回应'
    - '安卓登录失败被识别为核心 bug，优先修复'
    - '暗黑模式被识别为功能诉求，404 被识别为文档缺陷，二者处置不同'
    - 'webpack→vite 被识别为技术选型/范围较大的建议，没有被当成小修或直接忽略'
    - '明确说明哪些值得做、哪些不做或需要更多信息，而不是只复述反馈'
  pass_threshold: 0.9
