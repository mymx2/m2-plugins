# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: prd-quality
title: 小团队便签 PRD 覆盖问题、范围与可测指标
description: |
  验证 pm 产出的 PRD 不是空模板：包含目标用户与场景、目标与非目标、
  可测成功指标、范围/依赖/风险，并明确需要用户确认的问题。

input:
  prompt: |
    帮我写一个团队便签应用的 PRD，面向 20 人以内的小团队，
    要求两周内能上线最小可用版本。

judge:
  type: agent_judge
  model: openai/kimi-k3-1
  criteria:
    - '明确目标用户、使用场景和要解决的问题，而不是只列功能'
    - '包含目标与非目标（或明确的范围边界），并给出可测的成功指标'
    - '说明关键依赖、风险或待确认问题，不把假设写成事实'
    - 'PRD 结构可执行，没有堆砌通用模板或编造调研数据'
  pass_threshold: 0.9
