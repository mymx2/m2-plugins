# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: metrics-review
title: 周活下降的指标复盘不把相关当因果
description: |
  验证 pm 先定义指标与口径，再分群、列假设和所需数据，
  不把相关性直接说成原因，也不编造数字。

input:
  prompt: |
    我们的周活这周下降了 8%，帮我做一个指标复盘，
    看看可能原因和下一步该查什么。

judge:
  type: agent_judge
  model: openai/kimi-k3-1
  criteria:
    - '先确认周活口径、时间窗口和对比基线，而不是直接归因'
    - '按新老用户、渠道、平台、版本等维度提出分群检查'
    - '列出多种假设和验证所需数据，区分相关性与因果'
    - '没有编造具体数字、用户反馈或已完成的排查结果'
  pass_threshold: 0.9
