# skill-up 评测配置的模式版本，不要修改。
schema_version: v1alpha1

environment:
  # 产品文档任务无需沙箱。
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: codebuddy
  custom:
    transport: local
    response_format: text
    local:
      command: cbc
      args:
        - --settings
        - '{"disableAllHooks":true}'
        - --mcp-config
        - '{"mcpServers":{}}'
        - --strict-mcp-config
        - -p
        - --permission-mode=bypassPermissions
        - '${prompt}'

cases:
  files:
    - evals/cases/prd-quality.yaml
    - evals/cases/prioritization.yaml
    - evals/cases/metrics-review.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 12

report:
  formats: [json]
