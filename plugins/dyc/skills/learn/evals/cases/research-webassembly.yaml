# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: research-webassembly
# 用例摘要，显示在用例列表与报告中。
title: 多源研究产出结构化参考文章
# 用例背景：覆盖的行为或回归点。
description: |
  验证 learn 的研究流程：产出分节结构清晰的文章，
  引用具体来源，讲清适用场景与局限，不回避不确定处。

input:
  # 发给 Agent 的单轮用户 prompt。
  prompt: |
    深入研究 WebAssembly 在前端重型计算场景的应用，写成一篇可发布的
    短文（1200-2000 字）。来源限定 MDN WebAssembly 官方文档，不做
    全网调研，2-4 个来源即可。
    单轮任务：模式与选题由你决定，无需向我确认，直接产出成稿。
    成稿全文放在回复里，不要保存为文件。

# 零成本预检；不通过则跳过 judge。
expect:
  must_contain:
    - 'WebAssembly'

judge:
  # 评分策略：rule_based | agent_judge | script。
  type: agent_judge
  # judge 端点由 OPENAI_BASE_URL/OPENAI_API_KEY 解析（本机可用 localhost:8964 代理）。
  model: openai/kimi-k3-1
  criteria:
    - '输出是结构化文章（有标题层级），不是零散对话'
    - '引用了具体来源（URL 或来源名称）'
    - '同时覆盖能力边界与局限，而非只讲优点'
    - '对不确定或存在分歧的部分有明确说明'
  pass_threshold: 0.75
