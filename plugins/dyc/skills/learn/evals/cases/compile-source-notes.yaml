# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: compile-source-notes
# 用例摘要，显示在用例列表与报告中。
title: 把两份笔记整理为连贯入门文章并点明矛盾
# 用例背景：覆盖的行为或回归点。
description: |
  验证 learn 的素材整理模式：以两份笔记为源，
  产出连贯文章，且不掩盖笔记里标注的矛盾点。

context:
  # 用例运行前写入工作区的种子文件。
  files:
    'notes-a.md': |
      # 边缘计算笔记 A
      - 边缘计算把算力下沉到离用户最近的节点，核心收益是降低延迟
      - 典型场景：CDN 边缘函数、IoT 网关、门店本地推理
      - 关键权衡：带宽成本 vs 计算成本
    'notes-b.md': |
      # 边缘计算笔记 B
      - 冷启动是边缘函数的主要痛点，容器方案比进程方案冷启动更慢
      - 调度策略影响成本，请求路由到最近节点不一定最省钱
      - 矛盾点：笔记 A 说带宽成本是主要收益，但大流量静态内容场景
        实测 CDN 回源成本反而上升

input:
  # 发给 Agent 的单轮用户 prompt。
  prompt: |
    把当前目录这两份边缘计算的笔记整理成一篇连贯的入门文章，
    保留有价值的细节，矛盾的地方要明确指出来。
    文章全文直接放在回复里，不用另存文件。

# 零成本预检；不通过则跳过 judge。
expect:
  must_contain:
    - '边缘计算'

judge:
  # 评分策略：rule_based | agent_judge | script。
  type: rule_based
  success:
    - output_contains:
        all: ['边缘计算', '冷启动']
