# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: convert-url-to-markdown
# 用例摘要，显示在用例列表与报告中。
title: 按要求把 URL 内容转为 Markdown 保存
# 用例背景：覆盖的行为或回归点。
description: |
  验证 read 对"转成 Markdown / 保存"类请求：
  返回干净 Markdown 并落盘为 example.md，而不是只给摘要。

input:
  # 发给 Agent 的单轮用户 prompt。
  prompt: |
    把 https://example.com 的页面内容转成 Markdown，
    保存为当前目录的 example.md。

expect:
  files_exist:
    - 'example.md'

judge:
  type: agent_judge
  model: openai/kimi-k3-1
  criteria:
    - 'example.md 真实落盘，内容是 example.com 的 Markdown 正文而不是一句摘要'
    - 'Markdown 保留标题或链接等结构，没有把整页 HTML/JSON 原样倾倒'
    - '输出说明保存路径，并说明内容来自实际抓取而非记忆或 URL 猜测'
    - '没有编造页面里不存在的段落或数据'
  pass_threshold: 0.9
