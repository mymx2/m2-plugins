# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: summarize-url
# 用例摘要，显示在用例列表与报告中。
title: 抓取 URL 后给出基于来源的简要总结
# 用例背景：覆盖的行为或回归点。
description: |
  验证 read 对"读一下"类请求默认给简明总结：
  内容基于真实抓取结果，而不是整页原文倾倒。

input:
  # 发给 Agent 的单轮用户 prompt。
  prompt: |
    读一下 https://example.com ，用几句话总结这个页面的内容。

judge:
  type: agent_judge
  model: openai/kimi-k3-1
  criteria:
    - '给出基于实际抓取的简明总结，而不是整页原文倾倒'
    - '总结包含 Example Domain 的核心信息，没有编造页面里不存在的内容'
    - '默认输出形态是总结，没有擅自保存文件或生成多余附件'
    - '抓取失败时明确说明失败，而不是用常识替代抓取结果'
  pass_threshold: 0.9
