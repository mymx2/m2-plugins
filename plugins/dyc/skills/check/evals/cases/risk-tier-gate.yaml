# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: risk-tier-gate
# 用例摘要，显示在用例列表与报告中。
title: 一行 workflow 权限改动不能按 quick review 放行
# 用例背景：覆盖的行为或回归点。
description: |
  验证 check 的路径风险分级：改动只涉及一行 CI workflow 权限时，
  风险等级由路径决定而不是 diff 大小；必须走最重门禁并保留人工维护者复核。

input:
  # 发给 Agent 的单轮用户 prompt。
  prompt: |
    这次只改了一行 GitHub Actions workflow 的 permissions，diff 很小，
    可以直接按 quick review 过吗？给我结论和必须做的检查。

judge:
  # 评分策略：rule_based | agent_judge | script。
  type: agent_judge
  model: openai/kimi-k3-1
  criteria:
    - '明确拒绝只按 diff 大小判为 quick，指出风险等级跟随路径而不是行数'
    - '把 CI workflow 列为高风险路径，要求项目的最重门禁（完整/原生测试、安全审查）'
    - '要求人工维护者复核，并说明 agent、bot 或自动评审的通过不能替代人工'
    - '没有把“一行改动”当作低风险理由，也没有声称已运行未执行的检查'
  pass_threshold: 0.75
