catalog:
  zx: ^8.8.5
  '@types/fs-extra': ^11.0.4
  taze: ^19.17.2
  '@types/node': ^26.6.2
  typescript: ^7.0.2
  vitest: ^4.1.11
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.9
  vite-plus: ^0.2.9
  ajv: ^8.20.0
  ajv-formats: ^3.0.1
  tsx: ^4.23.15
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"

# Prefer catalog
catalogMode: prefer

# pnpm v12 strictDepBuilds 默认开启：tsx 依赖的 esbuild postinstall 需显式放行
allowBuilds:
  esbuild: true
shellEmulator: true
ignoreWorkspaceRootCheck: false
